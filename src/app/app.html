<app-code-rain [wavesEnabled]="openSection() === null" />
<div class="dim" [class.shown]="shown()" aria-hidden="true"></div>

<app-hero
  [name]="fullName"
  [role]="role"
  [sections]="sections"
  [about]="about"
  [active]="openSection()"
  (selected)="open($event)"
/>

<app-copyright [name]="fullName" [frozen]="openSection() !== null" />

<app-section-panel
  [section]="openSection()"
  [shown]="shown()"
  [originX]="originX()"
  [originY]="originY()"
  (back)="close()"
  (hidden)="onPanelHidden()"
/>
