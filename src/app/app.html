<app-code-rain />
<div class="dim" [class.shown]="shown()" aria-hidden="true"></div>

<app-hero
  [name]="fullName"
  [role]="role"
  [sections]="sections"
  [activeIndex]="openIndex()"
  (selected)="open($event)"
/>

<app-section-panel
  [section]="current()"
  [shown]="shown()"
  [originX]="originX()"
  [originY]="originY()"
  (back)="close()"
  (hidden)="onPanelHidden()"
/>
