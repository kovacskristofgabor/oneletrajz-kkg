<h1 #nameEl class="name">
  <button
    #nameButton
    type="button"
    class="name-button"
    [attr.aria-expanded]="active() === about()"
    (click)="select(about(), $event.currentTarget)"
  >
    {{ name() }}
  </button>
</h1>
<p #roleEl class="role">{{ role() }}</p>

<nav aria-label="Önéletrajz szakaszai">
  <ul class="menu">
    @for (section of sections(); track section.title) {
      <li>
        <button
          #menuItem
          type="button"
          class="menu-item"
          [attr.aria-expanded]="active() === section"
          (click)="select(section, $event.currentTarget)"
        >
          {{ section.title }}
        </button>
      </li>
    }
  </ul>
</nav>
